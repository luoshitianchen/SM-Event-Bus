[project]
name = "SM-Event-Bus"
version = "2.0.0"
description = "企业事件总线：主题、事件发布、订阅投递、重放与死信队列"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
