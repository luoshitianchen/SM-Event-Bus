# =============================================================================
# logrotate 配置 - sm-event-bus
# -----------------------------------------------------------------------------
# 日志路径 : /var/log/sm-event-bus/*.log
# 轮转策略 : 每日一次 / 单文件超过 100M 立即轮转
# 保留时间 : 14 天
# 压缩策略 : 旧日志压缩（delaycompress 避免刚轮转的当日文件被立即压缩）
# 缺失文件 : missingok 不报错
# 轮转后   : 通过 PID 文件发送 HUP 信号让进程重新打开日志
#            （如使用 supervisor，请将 postrotate 改为 supervisorctl restart sm-event-bus）
#
# 安装：
#   sudo cp config/logrotate.conf /etc/logrotate.d/sm-event-bus
#   sudo chmod 644 /etc/logrotate.d/sm-event-bus
# 调试：
#   sudo logrotate -d /etc/logrotate.d/sm-event-bus
# =============================================================================
/var/log/sm-event-bus/*.log {
    daily
    size 100M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    sharedscripts
    create 0640 smapp smapp
    postrotate
        # 方式一：PID 文件 HUP 信号（systemd / 裸进程部署推荐）
        if [ -f /var/run/sm-event-bus.pid ]; then
            kill -HUP "$(cat /var/run/sm-event-bus.pid)" 2>/dev/null || true
        fi
        # 方式二：supervisor 部署请启用下行，并注释上面方式一
        # supervisorctl -c /etc/supervisor/supervisord.conf restart sm-event-bus || true
    endscript
}
